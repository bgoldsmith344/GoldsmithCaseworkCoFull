name: Deploy preview to GitHub Pages

# Builds the site and publishes it to GitHub Pages so it can be previewed
# from a live URL. Runs on the feature branch (for previews), on main, and
# on demand. The site is served from /<repo>/, so the build is told its
# base path and github.io origin via env vars (see astro.config.mjs).

on:
  push:
    branches:
      - main
      - claude/goldsmiths-casework-site-u0m7tz
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build with Astro
        uses: withastro/action@v3
        env:
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/
          PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
